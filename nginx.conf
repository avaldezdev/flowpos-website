# FlowPOS Website — configuración de nginx para hosting propio (Coolify/Docker).
# Reproduce las cabeceras, la caché y las redirecciones que teníamos en netlify.toml.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Cabeceras de seguridad (se heredan en las demás rutas) ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.github.com; frame-ancestors 'none';" always;

    # --- Redirecciones (igual que en Netlify) ---
    location = /download   { return 301 /descargas.html; }
    location = /activate   { return 301 /activacion.html; }
    location = /activation { return 301 /activacion.html; }

    # --- Estáticos: caché larga (1 año) ---
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|webp|woff2?)$ {
        expires 1y;
        try_files $uri =404;
    }

    # --- Páginas: caché corta + URLs "limpias" (/descargas → descargas.html) ---
    location / {
        expires 1h;
        try_files $uri $uri.html $uri/ =404;
    }

    # Página 404 propia (si existe 404.html)
    error_page 404 /404.html;
}
