# FlowPOS Website — configuración de nginx para hosting propio (Coolify/Docker).
# Reproduce las cabeceras, la caché y las redirecciones que teníamos en netlify.toml.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Cabeceras de seguridad (se heredan en las demás rutas) ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # OJO: si agregás una herramienta externa (píxel, chat, mapa) y no la sumás acá,
    # el navegador la bloquea EN SILENCIO — no hay error visible, simplemente no mide.
    # Los dominios de Google/Meta son los que necesitan GA4, Google Ads y el píxel de
    # Meta. Mantener sincronizado con la misma cabecera en netlify.toml.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.github.com https://api.flowpos.com.py https://www.googletagmanager.com https://www.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://www.google.com https://td.doubleclick.net https://connect.facebook.net https://www.facebook.com; frame-src https://td.doubleclick.net https://www.googletagmanager.com https://www.facebook.com; frame-ancestors 'none';" always;

    # Emitir la cabecera Location en forma relativa (`/descargas.html`) en vez de
    # que nginx arme la URL absoluta. Detrás de Cloudflare, nginx recibe la petición
    # por http y armaba `http://flowpos.com.py/...`, obligando al navegador a un
    # salto extra para volver a https. Relativo = el navegador conserva el esquema.
    absolute_redirect off;

    # --- Redirecciones (igual que en Netlify) ---
    location = /download   { return 301 /descargas.html; }
    location = /activate   { return 301 /activacion.html; }
    location = /activation { return 301 /activacion.html; }

    # --- Atajos al portal del cliente (fáciles de dictar por teléfono/WhatsApp) ---
    location = /portal    { return 302 https://app.flowpos.com.py/; }
    location = /ingresar  { return 302 https://app.flowpos.com.py/; }
    location = /login     { return 302 https://app.flowpos.com.py/; }
    location = /cuenta    { return 302 https://app.flowpos.com.py/; }
    location = /registro  { return 302 https://app.flowpos.com.py/; }

    # --- Estáticos: caché larga (1 año) ---
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|webp|mp4|webm|woff2?)$ {
        expires 1y;
        try_files $uri =404;
    }

    # --- Páginas: caché corta + URLs "limpias" (/descargas → descargas.html) ---
    location / {
        expires 1h;
        try_files $uri $uri.html $uri/ =404;
    }

    # Página 404 propia (si existe 404.html)
    error_page 404 /404.html;
}
