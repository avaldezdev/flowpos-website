name: Update Release Metadata

# Trigger this workflow when:
# 1. A new release is published in the FlowPOS main repo
# 2. Manually via workflow_dispatch
# 3. On a schedule (daily check for new releases)

on:
  # Manual trigger
  workflow_dispatch:

  # Scheduled check (daily at 00:00 UTC)
  schedule:
    - cron: '0 0 * * *'

  # Webhook trigger from main FlowPOS repo (requires configuration)
  repository_dispatch:
    types: [new-release]

jobs:
  update-releases:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the website repository
      - name: Checkout Website Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Fetch latest release from FlowPOS repository
      - name: Fetch Latest Release
        id: fetch-release
        run: |
          # Fetch latest release from GitHub API
          RELEASE_DATA=$(curl -s https://api.github.com/repos/avaldezdev/flowpos/releases/latest)

          # Extract version (remove 'v' prefix if present)
          VERSION=$(echo "$RELEASE_DATA" | jq -r '.tag_name' | sed 's/^v//')

          # Extract release date
          DATE=$(echo "$RELEASE_DATA" | jq -r '.published_at' | cut -d'T' -f1)

          # Extract assets URLs
          WINDOWS_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | contains(".exe")) | .browser_download_url' | head -n1)
          MAC_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | contains(".dmg")) | .browser_download_url' | head -n1)
          LINUX_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | contains(".AppImage")) | .browser_download_url' | head -n1)

          # Extract release notes
          BODY=$(echo "$RELEASE_DATA" | jq -r '.body')

          # Save to output
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "windows_url=$WINDOWS_URL" >> $GITHUB_OUTPUT
          echo "mac_url=$MAC_URL" >> $GITHUB_OUTPUT
          echo "linux_url=$LINUX_URL" >> $GITHUB_OUTPUT

          # Save full data to file for processing
          echo "$RELEASE_DATA" > release-data.json

      # 3. Check if version has changed
      - name: Check Version Change
        id: check-version
        run: |
          CURRENT_VERSION=$(jq -r '.latest.version' assets/downloads/releases.json)
          NEW_VERSION="${{ steps.fetch-release.outputs.version }}"

          echo "Current version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"

          if [ "$CURRENT_VERSION" != "$NEW_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed from $CURRENT_VERSION to $NEW_VERSION"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No version change detected"
          fi

      # 4. Update releases.json if version changed
      - name: Update releases.json
        if: steps.check-version.outputs.changed == 'true'
        run: |
          # Backup current releases.json
          cp assets/downloads/releases.json assets/downloads/releases.json.bak

          # Read current data
          CURRENT_DATA=$(cat assets/downloads/releases.json)

          # Parse release notes (basic parsing - can be improved)
          NEW_FEATURES=$(echo "${{ steps.fetch-release.outputs.body }}" | grep -A10 "## New" | grep "^-" | sed 's/^- //' | jq -R -s -c 'split("\n")[:-1]' || echo '[]')
          IMPROVEMENTS=$(echo "${{ steps.fetch-release.outputs.body }}" | grep -A10 "## Improved" | grep "^-" | sed 's/^- //' | jq -R -s -c 'split("\n")[:-1]' || echo '[]')
          FIXES=$(echo "${{ steps.fetch-release.outputs.body }}" | grep -A10 "## Fixed" | grep "^-" | sed 's/^- //' | jq -R -s -c 'split("\n")[:-1]' || echo '[]')

          # Move current latest to previous
          PREVIOUS=$(echo "$CURRENT_DATA" | jq '.latest | {version, date, releaseNotes}')
          UPDATED_PREVIOUS=$(echo "$CURRENT_DATA" | jq --argjson prev "$PREVIOUS" '.previous = [$prev] + .previous | .previous |= .[0:5]')

          # Create new latest entry
          NEW_LATEST=$(jq -n \
            --arg version "${{ steps.fetch-release.outputs.version }}" \
            --arg date "${{ steps.fetch-release.outputs.date }}" \
            --arg win_url "${{ steps.fetch-release.outputs.windows_url }}" \
            --arg mac_url "${{ steps.fetch-release.outputs.mac_url }}" \
            --arg linux_url "${{ steps.fetch-release.outputs.linux_url }}" \
            --argjson new "$NEW_FEATURES" \
            --argjson improved "$IMPROVEMENTS" \
            --argjson fixed "$FIXES" \
            '{
              version: $version,
              date: $date,
              releaseNotes: {
                new: $new,
                improved: $improved,
                fixed: $fixed
              },
              downloads: {
                windows: $win_url,
                mac: $mac_url,
                linux: $linux_url
              },
              sizes: {
                windows: 157286400,
                mac: 167772160,
                linux: 162529280
              }
            }')

          # Update releases.json with new data
          echo "$UPDATED_PREVIOUS" | jq --argjson latest "$NEW_LATEST" '.latest = $latest' > assets/downloads/releases.json

          # Update lastUpdated in metadata
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq --arg time "$CURRENT_TIME" '.metadata.lastUpdated = $time' assets/downloads/releases.json > temp.json
          mv temp.json assets/downloads/releases.json

          echo "✅ releases.json updated successfully"

      # 5. Update netlify.toml redirects
      - name: Update Netlify Redirects
        if: steps.check-version.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.fetch-release.outputs.version }}"

          # Update download redirect URLs in netlify.toml
          sed -i "s|FlowPOS-Setup-[0-9.]*\.exe|FlowPOS-Setup-$VERSION.exe|g" netlify.toml
          sed -i "s|FlowPOS-[0-9.]*\.dmg|FlowPOS-$VERSION.dmg|g" netlify.toml
          sed -i "s|FlowPOS-[0-9.]*\.AppImage|FlowPOS-$VERSION.AppImage|g" netlify.toml

          echo "✅ netlify.toml updated"

      # 6. Commit and push changes
      - name: Commit and Push Changes
        if: steps.check-version.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add assets/downloads/releases.json netlify.toml
          git commit -m "chore: update to FlowPOS v${{ steps.fetch-release.outputs.version }}"
          git push

      # 7. Create a notification (optional - can integrate with Discord, Slack, etc.)
      - name: Notify Update
        if: steps.check-version.outputs.changed == 'true'
        run: |
          echo "🎉 Website updated to FlowPOS v${{ steps.fetch-release.outputs.version }}"
          echo "New version is now live on the website!"

      # 8. Trigger Netlify rebuild (optional - Netlify auto-builds on push)
      - name: Trigger Netlify Deploy
        if: steps.check-version.outputs.changed == 'true'
        run: |
          # Netlify will automatically rebuild on push
          # If you need to force rebuild, use Netlify Build Hooks:
          # curl -X POST -d {} https://api.netlify.com/build_hooks/YOUR_HOOK_ID
          echo "Netlify will auto-deploy on push"

      # Cleanup
      - name: Cleanup
        if: always()
        run: |
          rm -f release-data.json
          rm -f assets/downloads/releases.json.bak
